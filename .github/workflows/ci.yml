name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        PYTHONPATH=. pytest

    - name: Run deduplication script
      run: python scripts/remove_duplicates.py

    - name: Upload processed dataset as artifact
      uses: actions/upload-artifact@v4
      with:
        name: processed-dataset
        path: data/processed_dataset.csv

    - name: Install rclone
      run: |
        curl https://rclone.org/install.sh | sudo bash

    - name: Configure rclone for Google Drive
      run: |
        echo "${{ secrets.GDRIVE_SERVICE_ACCOUNT }}" > sa.json
        rclone config create gdrive drive scope=drive file sa.json

    - name: Upload to Google Drive
      run: |
        rclone copy data/processed_dataset.csv gdrive:ADS_CICD_LAB
