name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repo with full history so we can push back
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3: Cache pip dependencies
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 5: Run tests
    - name: Run tests
      run: |
        PYTHONPATH=. pytest

    # Step 6: Run deduplication script
    - name: Run deduplication script
      run: python scripts/remove_duplicates.py

    # Step 7: Commit updated processed dataset back to repo
    - name: Commit updated processed dataset
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed_dataset.csv
        git commit -m "Update processed_dataset.csv via CI" || echo "No changes to commit"
        git push
